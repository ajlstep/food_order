services:
  # dishes, menus, partners; talks only over NATS (no ports)
  catalog:
    build:
      context: ..                 # project root: the build needs ../shared
      dockerfile: catalog/Dockerfile
    image: food_order/catalog
    container_name: catalog
    env_file:
      - path: .env
        required: false
    environment:
      CATALOG_DB_PATH: /data/catalog.db
      CATALOG_NATS_URL: nats://nats:4222   # in Docker the server is always here, whatever .env says
      CATALOG_PARTNERS_FILE: /etc/catalog/partners.json
    volumes:
      - catalog-data:/data
    networks:
      - food_order
    restart: unless-stopped

volumes:
  catalog-data:

networks:
  food_order:
    external: true
