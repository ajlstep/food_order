services:
  nats:
    image: nats:2-alpine
    container_name: nats
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"   # client
      - "8222:8222"   # monitorizare HTTP
    volumes:
      - nats-data:/data
    networks:
      - food_order
    restart: unless-stopped

volumes:
  nats-data:

networks:
  food_order:
    external: true
