# NATS server of food-order.
#
# What lives here: who may connect, and what each one may do. Passwords come
# from environment variables (nuts/.env), never from this file.
#
# Subjects (the full story is in the vault, Gateway.md and Plan.md):
#   rpc.<service>.>   requests with an answer (plain NATS, no stream)
#   food.>            events between services      -> stream FOOD
#   logs.>            logs of all services         -> stream LOGS
#   notify.>          messages for people          -> stream NOTIFY
# The streams are created by the nats-setup job (shared/cmd/natssetup).

server_name: food-order
monitor_port: 8222

jetstream {
  store_dir: /data
}

authorization {
  users = [
    # Full rights. Used only by nats-setup and by you, with the nats CLI.
    {
      user: admin
      password: $NATS_PASSWORD_ADMIN
      permissions: { publish: ">", subscribe: ">" }
    }

    # The gateway asks every service; it answers nobody. Its notify module
    # turns events into messages for people: it reads FOOD only through the
    # consumer notifier and writes only to the notify queues, not to food.*.
    {
      user: gateway
      password: $NATS_PASSWORD_GATEWAY
      permissions: {
        publish: [
          "rpc.>"
          "logs.>"
          "notify.>"
          "$JS.API.STREAM.INFO.LOGS"
          "$JS.API.CONSUMER.INFO.FOOD.notifier"
          "$JS.API.CONSUMER.MSG.NEXT.FOOD.notifier"
          "$JS.ACK.FOOD.notifier.>"
        ]
        subscribe: ["_INBOX.>"]
      }
    }

    # users listens on rpc.users.> and answers (allow_responses lets it
    # reply without a publish right on the caller's inbox).
    {
      user: users
      password: $NATS_PASSWORD_USERS
      permissions: {
        # food.org.>: invitations and notices, which only users knows about
        publish: ["logs.>", "food.org.>", "$JS.API.STREAM.INFO.LOGS"]
        # _INBOX.>: answers to its own requests (the logger asks JetStream if
        # the stream LOGS exists, and JetStream confirms what was published)
        subscribe: ["rpc.users.>", "_INBOX.>"]
        allow_responses: true
      }
    }

    # The only exception to "everything goes through the gateway": the bot
    # reads its own queue of messages for people. It may use only the
    # consumer bot-telegram, created by nats-setup.
    {
      user: bot
      password: $NATS_PASSWORD_BOT
      permissions: {
        publish: [
          "logs.>"
          "$JS.API.STREAM.INFO.LOGS"
          "$JS.API.STREAM.INFO.NOTIFY"
          "$JS.API.CONSUMER.INFO.NOTIFY.bot-telegram"
          "$JS.API.CONSUMER.MSG.NEXT.NOTIFY.bot-telegram"
          "$JS.ACK.NOTIFY.bot-telegram.>"
        ]
        subscribe: ["_INBOX.>"]
      }
    }

    # The log collector: reads stream LOGS with its consumer.
    {
      user: logs
      password: $NATS_PASSWORD_LOGS
      permissions: {
        publish: [
          "$JS.API.STREAM.INFO.LOGS"
          "$JS.API.STREAM.CREATE.LOGS"
          "$JS.API.STREAM.UPDATE.LOGS"
          "$JS.API.CONSUMER.*.LOGS.>"
          "$JS.API.CONSUMER.*.*.LOGS.>"
          "$JS.ACK.LOGS.>"
        ]
        subscribe: ["_INBOX.>"]
      }
    }

    # core: recommendations and orders. It answers on rpc.core.>, reads its
    # consumer, and asks catalog and users only what it needs.
    {
      user: core
      password: $NATS_PASSWORD_CORE
      permissions: {
        publish: [
          "logs.>"
          "$JS.API.STREAM.INFO.LOGS"
          "rpc.catalog.menu.get"
          "rpc.catalog.dishes.get"
          "rpc.catalog.similar"
          "rpc.users.profile.food.get"
          "rpc.users.profile.due"
          "rpc.users.org.snapshot"
          "rpc.users.org.company.get"
          "food.menu.requested"
          "food.recommendation.requested"
          "food.recommendation.ready"
          "food.rating.requested"
          "food.feedback.parse.requested"
          "food.alert"
          "$JS.API.CONSUMER.INFO.FOOD.core"
          "$JS.API.CONSUMER.MSG.NEXT.FOOD.core"
          "$JS.ACK.FOOD.core.>"
        ]
        subscribe: ["rpc.core.>", "_INBOX.>"]
        allow_responses: true
      }
    }

    # catalog: dishes, menus, partners. It asks nobody.
    {
      user: catalog
      password: $NATS_PASSWORD_CATALOG
      permissions: {
        publish: [
          "logs.>"
          "$JS.API.STREAM.INFO.LOGS"
          "food.menu.ready"
          "food.dish.analyze.requested"
          "food.dish.embed.requested"
          "food.alert"
          "$JS.API.CONSUMER.INFO.FOOD.catalog"
          "$JS.API.CONSUMER.MSG.NEXT.FOOD.catalog"
          "$JS.ACK.FOOD.catalog.>"
        ]
        subscribe: ["rpc.catalog.>", "_INBOX.>"]
        allow_responses: true
      }
    }

    # parser: reads the sites when asked, answers with events.
    {
      user: parser
      password: $NATS_PASSWORD_PARSER
      permissions: {
        publish: [
          "logs.>"
          "$JS.API.STREAM.INFO.LOGS"
          "food.menu.fetched"
          "food.menu.error"
          "$JS.API.CONSUMER.INFO.FOOD.parser"
          "$JS.API.CONSUMER.MSG.NEXT.FOOD.parser"
          "$JS.ACK.FOOD.parser.>"
        ]
        subscribe: ["_INBOX.>"]
      }
    }
  ]
}
