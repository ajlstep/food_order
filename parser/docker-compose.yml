services:
  # reads the menu from the sites. The port is only for /v1/fetch, for debugging.
  parser:
    build:
      context: ..                 # project root: the build needs ../shared
      dockerfile: parser/Dockerfile
    image: food_order/parser
    container_name: parser
    env_file:
      - path: .env
        required: false
    environment:
      PARSER_RAW_DIR: /data/raw
      PARSER_NATS_URL: nats://nats:4222   # in Docker the server is always here, whatever .env says
    ports:
      - "127.0.0.1:9083:9083"
    volumes:
      - parser-data:/data
    networks:
      - food_order
    restart: unless-stopped

volumes:
  parser-data:

networks:
  food_order:
    external: true
