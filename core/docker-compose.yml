services:
  # recommendations and orders; talks only over NATS (no ports)
  core:
    build:
      context: ..                 # project root: the build needs ../shared
      dockerfile: core/Dockerfile
    image: food_order/core
    container_name: core
    env_file:
      - path: .env
        required: false
    environment:
      CORE_DB_PATH: /data/core.db
      CORE_NATS_URL: nats://nats:4222   # in Docker the server is always here, whatever .env says
    volumes:
      - core-data:/data
    networks:
      - food_order
    restart: unless-stopped

volumes:
  core-data:

networks:
  food_order:
    external: true
