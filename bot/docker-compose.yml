services:
  bot:
    build:
      context: ..                 # project root: the build needs ../shared
      dockerfile: bot/Dockerfile
    image: food_order/bot
    container_name: bot
    env_file:
      - path: .env
        required: false
    environment:
      BOT_NATS_URL: nats://nats:4222   # in Docker the server is always here, whatever .env says
    ports:
      # only this computer; Telegram comes through ngrok, inside Docker
      - "127.0.0.1:8086:8086"
    networks:
      - food_order
    restart: unless-stopped

networks:
  food_order:
    external: true
